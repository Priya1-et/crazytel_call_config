; RTP / ICE — tune for your public IP and firewall.
; Install as e.g. /etc/asterisk/rtp.conf (merge with distro defaults if needed).
; Firewall: allow inbound/outbound UDP 10000-20000 to this host.

[general]
rtpstart=10000
rtpend=20000
icesupport=yes
; NAT: set __PUBLIC_IPV4__ to PBX public IP (e.g. 223.178.215.86)
externaddr=223.178.215.86
stunaddr=stun.l.google.com:19302
