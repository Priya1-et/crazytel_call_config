; Dialplan: WebRTC (venus) ↔ Crazytel trunk (crazytel-trunk)
; Verified DID/CLI (E.164): 61272643281. Inbound normalizes 0…/+… → 61… ; outbound dial still uses 0…/0011… to PSTN.
; Crazytel intl: enable in portal; dial India e.g. 0011919876543210 or +919876543210.

[globals]
DEFAULT_OUTBOUND_CLI=61272643281
ALLOWED_OUTBOUND_PATTERN=^61272643281$
ALLOWED_DID_PATTERN=^61272643281$
DEFAULT_CONSULTANT=venus
; Recording — all answered calls (outbound + inbound). UI Yes/No modal is ignored here.
RECORDINGS_BASE=/var/spool/asterisk/recordings

[sub-set-outbound-cli]
exten => s,1,NoOp(Set outbound CLI from X-Outgoing-Number)
 same => n,Set(SEL=${PJSIP_HEADER(read,X-Outgoing-Number)})
 same => n,GotoIf($["${SEL}" = ""]?use_default)
 same => n,GotoIf($[${REGEX("^0[0-9]{9}$" ${SEL})}]?sel_nat_to_e164)
 same => n,GotoIf($[${REGEX("${ALLOWED_OUTBOUND_PATTERN}" "${SEL}")}]?use_selected)
 same => n,Goto(use_default)
 same => n(sel_nat_to_e164),Set(SEL=61${SEL:1})
 same => n,GotoIf($[${REGEX("${ALLOWED_OUTBOUND_PATTERN}" "${SEL}")}]?use_selected)
 same => n,Goto(use_default)
 same => n(use_selected),Set(CALLERID(num)=${SEL})
 same => n,Set(CALLERID(name)=${SEL})
 same => n,Return()
 same => n(use_default),Set(CALLERID(num)=${DEFAULT_OUTBOUND_CLI})
 same => n,Set(CALLERID(name)=${DEFAULT_OUTBOUND_CLI})
 same => n,Return()

[sub-normalize-outbound]
exten => s,1,NoOp(Normalize outbound dial arg=${ARG1})
 same => n,Set(DIALED=${ARG1})
 same => n,GotoIf($[${REGEX("^0011" ${DIALED})}]?done)
 same => n,GotoIf($[${REGEX("^0091" ${DIALED})}]?legacy_0091)
 same => n,GotoIf($[${REGEX("^\\+" ${DIALED})}]?plus)
 same => n,GotoIf($[${REGEX("^61" ${DIALED})}]?from_61)
 same => n,GotoIf($[${REGEX("^1800" ${DIALED})}]?done)
 same => n,GotoIf($[${REGEX("^1300" ${DIALED})}]?done)
 same => n,GotoIf($[${REGEX("^13[0-9]" ${DIALED})}]?done)
 same => n,GotoIf($[${REGEX("^0[0-9]{9}$" ${DIALED})}]?done)
 same => n,GotoIf($[${REGEX("^04[0-9]{8}$" ${DIALED})}]?done)
 same => n,GotoIf($[${REGEX("^4[0-9]{8}$" ${DIALED})}]?mobile_nine)
 same => n,GotoIf($[${REGEX("^91[0-9]{10}$" ${DIALED})}]?india_mobile)
 same => n,GotoIf($[${REGEX("^1[0-9]{10}$" ${DIALED})}]?nanp)
 same => n,Set(DIALED=0011${DIALED})
 same => n,Goto(done)
 same => n(legacy_0091),Set(DIALED=0011${DIALED:2})
 same => n,Goto(done)
 same => n(plus),Set(DIALED=${DIALED:1})
 same => n,GotoIf($[${REGEX("^61" ${DIALED})}]?from_61)
 same => n,Set(DIALED=0011${DIALED})
 same => n,Goto(done)
 same => n(from_61),Set(DIALED=0${DIALED:2})
 same => n,Goto(done)
 same => n(mobile_nine),Set(DIALED=0${DIALED})
 same => n,Goto(done)
 same => n(india_mobile),Set(DIALED=0011${DIALED})
 same => n,Goto(done)
 same => n(nanp),Set(DIALED=0011${DIALED})
 same => n(done),Set(OUTBOUND_DIAL=${DIALED})
 same => n,Return()

[sub-normalize-inbound-did]
exten => s,1,NoOp(Normalize inbound DID to E.164 arg=${ARG1})
 same => n,Set(NORM=${ARG1})
 same => n,GotoIf($[${REGEX("^\\+" ${NORM})}]?strip_plus)
 same => n,Goto(check_e164)
 same => n(strip_plus),Set(NORM=${NORM:1})
 same => n(check_e164),GotoIf($[${REGEX("^61" ${NORM})}]?done)
 same => n,GotoIf($[${REGEX("^0" ${NORM})}]?nat_to_e164)
 same => n,GotoIf($[${LEN(${NORM})} = 8]?eight_digit)
 same => n,Set(NORM=61${NORM})
 same => n,Goto(done)
 same => n(nat_to_e164),Set(NORM=61${NORM:1})
 same => n,Goto(done)
 same => n(eight_digit),Set(NORM=612${NORM})
 same => n(done),Set(NORM_DID=${NORM})
 same => n,Return()

[check-dnd]
exten => s,1,NoOp(Checking DND for ${CONSULTANT})
 same => n,GotoIf($[${DB_EXISTS(dnd/${CONSULTANT})}]?has_key:no_dnd)
 same => n(has_key),GotoIf($["${DB(dnd/${CONSULTANT})}" = "1"]?is_dnd:no_dnd)
 same => n(is_dnd),NoOp(DND active for ${CONSULTANT})
 same => n,Busy(5)
 same => n,Hangup()
 same => n(no_dnd),Return()

[sub-start-outbound-record]
; Trunk leg when PSTN answers (Dial U) — always record answered leg.
exten => s,1,NoOp(Outbound record all ${OUTBOUND_DIAL})
 same => n,Set(MONFILE=${RECORDINGS_BASE}/outgoing/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${OUTBOUND_DIAL}-${UNIQUEID}.wav)
 same => n,MixMonitor(${MONFILE})
 same => n,Return()

[sub-start-inbound-record]
; Venus leg when consultant answers (Dial U) — always record on answer.
exten => s,1,NoOp(Inbound record all caller=${ARG1})
 same => n,Set(MONFILE=${RECORDINGS_BASE}/incoming/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${ARG1}-${UNIQUEID}.wav)
 same => n,MixMonitor(${MONFILE})
 same => n,Return()

[sub-route-inbound-consultant]
exten => s,1,NoOp(Route inbound DID ${NORM_DID} to ${CONSULTANT})
; same => n,GotoIf($[${REGEX("${ALLOWED_DID_PATTERN}" "${NORM_DID}")}]?allowed)
 same => n,GotoIf($[${REGEX("^61272643281$" ${NORM_DID})}]?allowed)
 same => n,NoOp(DID ${NORM_DID} not in allowed block)
 same => n,Congestion(5)
 same => n,Hangup()
 same => n(allowed),Set(CONSULTANT=${DEFAULT_CONSULTANT})
 same => n,GoSub(check-dnd,s,1)
 same => n,Dial(PJSIP/${CONSULTANT},40,U(sub-start-inbound-record^s^1^${CALLERID(num)}))
 same => n,Hangup()

[from-webrtc]
; Outbound: normalize then Dial via crazytel-trunk (AU 0…, intl 0011…, +country, 13/1300/1800).

exten => _X.,1,NoOp(Outbound ${EXTEN})
 same => n,Gosub(sub-normalize-outbound,s,1(${EXTEN}))
 same => n,Gosub(sub-set-outbound-cli,s,1)
 same => n,NoOp(Dialing ${OUTBOUND_DIAL} via crazytel-trunk record-all-on-answer)
 same => n,Dial(PJSIP/${OUTBOUND_DIAL}@crazytel-trunk,60,U(sub-start-outbound-record^s^1))
 same => n,Hangup()

exten => i,1,Hangup()
exten => s,1,Hangup()

[from-crazytel]
; Inbound from Crazytel — normalize DID then route to venus.

exten => _X.,1,NoOp(Inbound raw ${EXTEN} from ${CALLERID(num)})
 same => n,Gosub(sub-normalize-inbound-did,s,1(${EXTEN}))
 same => n,Gosub(sub-route-inbound-consultant,s,1)

exten => _+X.,1,NoOp(Inbound raw ${EXTEN} from ${CALLERID(num)})
 same => n,Gosub(sub-normalize-inbound-did,s,1(${EXTEN}))
 same => n,Gosub(sub-route-inbound-consultant,s,1)

exten => i,1,Hangup()
exten => s,1,Hangup()

