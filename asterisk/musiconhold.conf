; Music on hold for outbound/inbound hold (callee/caller hears this while consultant holds).
; Deploy: sudo mkdir -p /var/lib/asterisk/moh/crazytel-hold
;         sudo cp moh/hold-message.wav /var/lib/asterisk/moh/crazytel-hold/
;         sudo chown -R asterisk:asterisk /var/lib/asterisk/moh

[general]
cachertclasses=yes

[crazytel-hold]
mode=files
directory=moh/crazytel-hold
sort=alpha
loop_last=yes

; Fallback if custom files missing — uses built-in default MOH
[default]
mode=files
directory=moh
sort=alpha
