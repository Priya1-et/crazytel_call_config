; HTTP server for Asterisk WebSocket (sip.js WSS/WS).
; Pair with transport-wss in pjsip.conf. Paths must match your TLS cert deployment.

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8087

tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/tls/asterisk.crt
tlsprivatekey=/etc/asterisk/tls/asterisk.key
