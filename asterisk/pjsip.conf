; PJSIP: WebRTC (WSS) + Crazytel SIP trunk (UDP)
; Replace ALL __PLACEHOLDER__ / example values with data from the Crazytel portal and your TLS cert paths.
; Do not commit real secrets.

; --- TLS cert for WSS (same paths as in deployment) ---
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/letsencrypt/live/__YOUR_PBX_HOSTNAME__/fullchain.pem
priv_key_file=/etc/letsencrypt/live/__YOUR_PBX_HOSTNAME__/privkey.pem
method=tlsv1_2

; Dev / lab without TLS: use separate ws transport on a private network only (not for public Internet).
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; --- UDP to Crazytel (SIP trunk) — static public IP for NAT (same as IAGU setup) ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
external_media_address=223.178.215.86
external_signaling_address=223.178.215.86
; Non-default trunk port: use contact=sip:sip.crazytel.net.au:PORT on [crazytel-trunk] aor

; ========== WebRTC endpoint (browser / sip.js) ==========
; Match VITE_SIP_USERNAME / VITE_SIP_PASSWORD (default consultant: venus)

[venus-auth]
type=auth
auth_type=userpass
username=venus
; MUST match crazytel_calling_fe .env VITE_SIP_PASSWORD on deploy
password=__SET_STRONG_WEBRTC_PASSWORD__

[venus-aor]
type=aor
max_contacts=5
remove_existing=yes

[venus]
type=endpoint
context=from-webrtc
disallow=all
allow=opus,ulaw,alaw
auth=venus-auth
aors=venus-aor
; Production: use transport-wss. Local dev on LAN: transport-ws (no TLS).
transport=transport-wss
webrtc=yes
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtp_symmetric=yes
rewrite_contact=yes
force_rport=yes
rtp_timeout=60
rtp_timeout_hold=300
direct_media=no
media_encryption=dtls
use_avpf=yes
; If you use transport-ws without TLS, WebRTC still expects SRTP on the channel; test carefully.

; ========== Crazytel SIP trunk (IP authentication — same pattern as IAGU) ==========
; Crazytel must allowlist this PBX public IP: 223.178.215.86 (portal / support).
; Trunk host: sip.crazytel.net.au. No SIP username/password on trunk; no registration object.

[crazytel-trunk]
type=endpoint
transport=transport-udp
context=from-crazytel
disallow=all
allow=ulaw
allow=alaw
from_domain=crazytel.net.au
direct_media=no
ice_support=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
trust_id_inbound=yes
send_connected_line=no
dtmf_mode=rfc4733
aors=crazytel-trunk

[crazytel-trunk]
type=aor
contact=sip:sip.crazytel.net.au
qualify_frequency=60
qualify_timeout=5

[crazytel-trunk]
type=identify
endpoint=crazytel-trunk
match=sip.crazytel.net.au
; Inbound often requires SBC IP matches (hostname alone may be insufficient). Add from Crazytel portal:
;match=203.0.113.10
;match=203.0.113.11

; --- Optional: username/password trunk (if Crazytel does not use IP auth) ---
; Uncomment and remove IP-only sections above; set portal credentials.
;[crazytel-auth]
;type=auth
;auth_type=userpass
;username=USERNAME
;password=PASSWORD
;[crazytel-reg]
;type=registration
;transport=transport-udp
;outbound_auth=crazytel-auth
;endpoint=crazytel-trunk
;server_uri=sip:sip.crazytel.net.au
;client_uri=sip:USERNAME@sip.crazytel.net.au
;retry_interval=60
