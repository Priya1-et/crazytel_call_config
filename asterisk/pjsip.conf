[global]
type=global
user_agent=WebCallingAsterisk

; Plain WS — local testing only
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; Secure WSS — browser connections
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
; SAME self-signed cert as before ✅
cert_file=/etc/asterisk/tls/asterisk.crt
priv_key_file=/etc/asterisk/tls/asterisk.key
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
external_media_address=223.178.215.86
external_signaling_address=223.178.215.86

; UDP — CrazyTel SIP trunk
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
external_media_address=223.178.215.86
external_signaling_address=223.178.215.86

; ========== CrazyTel SIP Trunk ==========
[crazytel-trunk]
type=endpoint
transport=transport-udp
context=from-crazytel
disallow=all
allow=ulaw
allow=alaw
from_domain=crazytel.net.au
direct_media=no
ice_support=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
trust_id_inbound=yes
dtmf_mode=rfc4733
aors=crazytel-trunk

[crazytel-trunk]
type=aor
contact=sip:sip.biz.crazytel.net.au
qualify_frequency=60
qualify_timeout=5

[crazytel-trunk]
type=identify
endpoint=crazytel-trunk
match=sip.biz.crazytel.net.au


; ========== Venus (consultant) ==========
[venus]
type=endpoint
transport=transport-wss
context=from-webrtc
disallow=all
allow=opus
allow=ulaw
webrtc=yes
dtls_auto_generate_cert=yes
dtls_verify=no
dtls_setup=actpass
media_encryption=dtls
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
use_avpf=yes
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
direct_media=no
aors=venus
auth=venus
; CallerID restored from old config ✅
callerid=Venus <0290178400>

[venus]
type=auth
auth_type=userpass
username=venus
; Same password as before ✅
password=Venus@2024!

[venus]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30