[global]
type=global
user_agent=WebCallingAsterisk

; ========== Plain WS — local testing only ==========
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; ========== Secure WSS — browser ==========
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/asterisk/tls/asterisk.crt
priv_key_file=/etc/asterisk/tls/asterisk.key
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
external_media_address=223.178.215.86
external_signaling_address=223.178.215.86

; ========== UDP — Crazytel inbound (they send UDP) ==========
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:25160
external_media_address=223.178.215.86
external_signaling_address=223.178.215.86

; ========== TCP — Crazytel outbound ==========
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:25160
external_media_address=223.178.215.86
external_signaling_address=223.178.215.86

; ========== CrazyTel SIP Trunk ==========
[crazytel-trunk]
type=endpoint
transport=transport-udp
context=from-crazytel
disallow=all
allow=ulaw
allow=alaw
from_domain=sip.biz.crazytel.net.au
direct_media=no
ice_support=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
trust_id_inbound=yes
dtmf_mode=rfc4733
aors=crazytel-trunk
send_pai=yes
moh_suggest=crazytel-hold

[crazytel-trunk]
type=aor
contact=sip:sip.biz.crazytel.net.au
qualify_frequency=60
qualify_timeout=5

[crazytel-trunk]
type=identify
endpoint=crazytel-trunk
match=203.29.243.226/32
match=103.140.134.2/32
match=43.245.163.222/32
match=103.140.134.239/32
match=203.57.50.122/32
match=103.137.56.90/32
match=103.137.56.91/32
match=103.137.56.95/32
match=39.84.173.22/32
match=103.108.94.197/32
match=38.54.36.75/32
match=103.100.36.19/32
match=45.63.96.241/32
match=45.63.54.111/32

; ========== Venus (consultant) ==========
[venus]
type=endpoint
transport=transport-wss
context=from-webrtc
disallow=all
allow=ulaw
allow=alaw
allow=opus
webrtc=yes
dtls_auto_generate_cert=yes
dtls_verify=no
dtls_setup=actpass
media_encryption=dtls
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
use_avpf=yes
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
direct_media=no
; MOH for remote party when consultant holds (outbound/inbound)
moh_suggest=crazytel-hold
; Mark venus busy when on a call → inbound callers get announcement+MOH queue (not parallel browser ring)
device_state_busy_at=1
send_pai=yes
aors=venus
auth=venus
callerid=Venus <61272643281>

[venus]
type=auth
auth_type=userpass
username=venus
password=Venus@2024!

[venus]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30
default_expiration=3600
minimum_expiration=60
maximum_expiration=7200