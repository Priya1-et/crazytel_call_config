# coturn — TURN relay for browser WebRTC (use when Google STUN in FE is not enough).
# Dev shortcut: FE .env can use stun:stun.l.google.com:19302 without running coturn.
# Production: set VITE_TURN_URL=turn:YOUR_IP:3478 and credentials below.
# Install: `apt install coturn` (Debian/Ubuntu). See RUNBOOK.md.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
realm=__YOUR_TURN_REALM__
server-name=__YOUR_PUBLIC_HOSTNAME__

# Public IPv4 of this machine (required when behind NAT).
external-ip=__YOUR_PUBLIC_IPV4__

# Relay range — open these UDP ports in firewall alongside Asterisk RTP (e.g. 10000-20000).
min-port=49152
max-port=65535

# Static user for WebRTC (match VITE_TURN_* in frontend; use a strong password in prod).
user=__TURN_USERNAME__:__TURN_PASSWORD__

# Listening addresses (adjust if multi-homed).
listening-ip=0.0.0.0
relay-ip=__YOUR_PUBLIC_IPV4__

# TLS certs for TURNS (optional; browser may use turn: not turns:)
#cert=/etc/letsencrypt/live/__YOUR_HOST__/fullchain.pem
#pkey=/etc/letsencrypt/live/__YOUR_HOST__/privkey.pem

no-cli
no-tlsv1
no-tlsv1_1

# Verbose logging only while debugging:
#verbose
